# systemd-networkd drop-in: keep the broker's addresses on this host.
#
# The cameras reach the vendor cloud at fixed IPs, and the router's static
# routes send that traffic to 192.168.68.114. The host running the broker must
# therefore own 192.168.68.114 and every vendor IP as a /32, or the camera
# rejects replies that do not carry the vendor's address as their source.
#
# Why this is a network config and not a one-shot script: on the dev laptop,
# NetworkManager re-ran DHCP after a Wi-Fi roam (2026-10-24 19:42) and wiped
# the hand-added addresses, and both cameras dropped. Addresses that live in
# the interface's own configuration are re-applied on every reconfigure.
#
# Only ONE host on the LAN may hold these addresses at a time. Remove them from
# the old host (and disable its ziot-ips.service) before installing this one;
# see the README section "Deploying to a server (broker + bridge)".
#
# The list must match `VENDOR_IPS` in `ziot_fake_cloud.py` and the addresses in
# `ziot-ips.service`; a test checks it against the former.
#
# Install (Ubuntu with netplan rendering to systemd-networkd):
#   ls /run/systemd/network/      # the drop-in directory below must be named
#                                 # after the interface's generated file
#   sudo install -D -m 644 ziot-addresses.conf \
#       /etc/systemd/network/10-netplan-wlp1s0.network.d/ziot-addresses.conf
#   sudo networkctl reload
#   ip -br addr show wlp1s0       # all six addresses should be listed
# If they do not appear, `sudo networkctl reconfigure wlp1s0` applies them at
# the cost of a brief network blip.

[Network]
Address=192.168.68.114/32
Address=120.26.121.165/32
Address=47.110.77.193/32
Address=47.97.71.82/32
Address=47.238.125.111/32
Address=8.130.23.234/32
